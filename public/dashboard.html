<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 문서 관리</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .header {
            background: white;
            padding: 16px 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-left .brand { font-size: 20px; font-weight: 700; color: #1a73e8; }
        .header-left .brand span { color: #0d47a1; }
        .header-left .user-info { color: #5f6368; font-size: 14px; }
        .header-left .user-info strong { color: #1a73e8; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .btn-logout {
            padding: 8px 20px;
            background: #f1f3f4;
            border: none;
            border-radius: 8px;
            color: #3c4043;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-logout:hover { background: #e8eaed; }
        .main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
        .welcome-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .welcome-section h1 { font-size: 28px; color: #202124; margin-bottom: 8px; }
        .welcome-section p { color: #5f6368; font-size: 16px; }
        .welcome-section .badge {
            display: inline-block;
            background: #e8f0fe;
            color: #1a73e8;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 8px;
        }
        .section-title { font-size: 20px; font-weight: 600; color: #202124; margin-bottom: 20px; }
        .pdf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .pdf-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .pdf-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            border-color: #1a73e8;
        }
        .pdf-card .icon { font-size: 36px; margin-bottom: 12px; }
        .pdf-card .title { font-size: 16px; font-weight: 600; color: #202124; margin-bottom: 4px; }
        .pdf-card .description { font-size: 14px; color: #5f6368; line-height: 1.5; margin-bottom: 12px; }
        .pdf-card .meta { font-size: 12px; color: #9aa0a6; display: flex; justify-content: space-between; align-items: center; }
        .pdf-card .status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        .pdf-card .status.available { background: #e6f4ea; color: #1e7e34; }
        .pdf-card .status.locked { background: #fce8e6; color: #d93025; }
        .pdf-card .open-btn {
            padding: 6px 16px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
        }
        .pdf-card .open-btn:hover { background: #0d47a1; }
        .pdf-card .open-btn:disabled { background: #dadce0; cursor: not-allowed; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: auto;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e8eaed;
        }
        .modal-header h2 { font-size: 20px; color: #202124; }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #5f6368;
            padding: 4px 12px;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .modal-close:hover { background: #f1f3f4; }
        .pdf-viewer { width: 100%; min-height: 500px; border: none; border-radius: 8px; }
        .pdf-viewer iframe { width: 100%; height: 600px; border: none; border-radius: 8px; }
        @media (max-width: 768px) {
            .header { padding: 12px 16px; flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; justify-content: flex-end; }
            .main { padding: 16px 12px; }
            .welcome-section { padding: 20px; }
            .welcome-section h1 { font-size: 22px; }
            .pdf-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 16px; margin: 10px; }
            .pdf-viewer iframe { height: 400px; }
        }
        @media (max-width: 480px) {
            .header-left .brand { font-size: 16px; }
            .header-left .user-info { font-size: 12px; }
            .pdf-card { padding: 16px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <div class="brand">📄 <span>문서</span> 관리</div>
            <div class="user-info">👤 <strong id="userEmail">user@domain.com</strong></div>
        </div>
        <div class="header-right">
            <button class="btn-logout" onclick="handleLogout()">🚪 로그아웃</button>
        </div>
    </header>

    <main class="main">
        <section class="welcome-section">
            <h1>📄 문서 관리</h1>
            <p>하이웍스에서 승인된 문서에 접근하세요.</p>
            <span class="badge">✅ 인증됨 · 보안 연결</span>
        </section>

        <h2 class="section-title">📁 문서 목록</h2>
        <div class="pdf-grid" id="pdfGrid"></div>
    </main>

    <div class="modal" id="pdfModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">문서 보기</h2>
                <button class="modal-close" onclick="closePDF()">✕</button>
            </div>
            <div class="pdf-viewer" id="pdfViewer">
                <p style="text-align:center;padding:40px;color:#5f6368;">📄 문서를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            SESSION_KEY: 'chameleon_session',
            LOGIN_URL: '/login',
            API_URL: '',
            PDFS: [
                { id: 1, title: '2026년 사업 계획서', description: '2026년 주요 사업 계획 및 목표', icon: '📊',
                    file: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    status: 'available', date: '2026-01-15' },
                { id: 2, title: '직원 복지 정책 안내', description: '직원 복지 제도 및 혜택 안내', icon: '📋',
                    file: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    status: 'available', date: '2026-02-01' },
                { id: 3, title: '보안 가이드라인 v3.2', description: '정보 보안 정책 및 가이드라인', icon: '🔒',
                    file: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    status: 'available', date: '2026-02-20' },
                { id: 4, title: '인사 규정 개정안', description: '2026년 인사 규정 개정 내용', icon: '📜',
                    file: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    status: 'available', date: '2026-03-01' },
                { id: 5, title: '회계 감사 보고서', description: '2025년도 회계 감사 결과 보고서', icon: '💰',
                    file: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    status: 'available', date: '2026-03-15' },
                { id: 6, title: 'IT 인프라 현황', description: 'IT 인프라 현황 및 개선 계획', icon: '🖥️',
                    file: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    status: 'available', date: '2026-04-01' }
            ]
        };

        function getEmailFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('email') || '';
        }

        function checkSession() {
            try {
                const session = sessionStorage.getItem(CONFIG.SESSION_KEY);
                if (!session) return null;
                const data = JSON.parse(session);
                if (data.verified && data.passwordVerified && Date.now() < data.expiresAt) {
                    return data;
                }
            } catch (e) {}
            return null;
        }

        function renderPDFs() {
            const grid = document.getElementById('pdfGrid');
            grid.innerHTML = '';
            CONFIG.PDFS.forEach(pdf => {
                const card = document.createElement('div');
                card.className = 'pdf-card';
                card.innerHTML = `
                    <div class="icon">${pdf.icon}</div>
                    <div class="title">${pdf.title}</div>
                    <div class="description">${pdf.description}</div>
                    <div class="meta">
                        <span>📅 ${pdf.date}</span>
                        <span class="status ${pdf.status}">${pdf.status === 'available' ? '✅ 접근 가능' : '🔒 잠김'}</span>
                    </div>
                    <button class="open-btn" onclick="openPDF(${pdf.id})" ${pdf.status !== 'available' ? 'disabled' : ''}>
                        📖 문서 열기
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function openPDF(id) {
            const pdf = CONFIG.PDFS.find(p => p.id === id);
            if (!pdf || pdf.status !== 'available') return;
            const modal = document.getElementById('pdfModal');
            document.getElementById('pdfViewer').innerHTML = `
                <iframe src="${pdf.file}#toolbar=1&navpanes=1&scrollbar=1" 
                        style="width:100%;height:600px;border:none;border-radius:8px;"
                        allowfullscreen></iframe>
            `;
            document.getElementById('modalTitle').textContent = pdf.icon + ' ' + pdf.title;
            modal.classList.add('show');
            logAccess(pdf.title);
        }

        function closePDF() {
            document.getElementById('pdfModal').classList.remove('show');
            document.getElementById('pdfViewer').innerHTML = '<p style="text-align:center;padding:40px;color:#5f6368;">📄 문서를 불러오는 중...</p>';
        }

        function logAccess(documentTitle) {
            const session = checkSession();
            const email = session ? session.email : getEmailFromURL() || 'unknown';
            const msg = '📄 *문서 접근*\n\n*📧 Email:* ' + email + '\n*📄 문서:* ' + documentTitle + '\n*🕐 시간:* ' + new Date()
                .toLocaleString('ko-KR');
            fetch('/api/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, parse_mode: 'Markdown' })
            }).catch(() => {});
        }

        function handleLogout() {
            sessionStorage.removeItem(CONFIG.SESSION_KEY);
            window.location.href = CONFIG.LOGIN_URL;
        }

        function init() {
            const session = checkSession();
            const urlEmail = getEmailFromURL();
            const email = session ? session.email : urlEmail;
            if (!email) {
                window.location.href = CONFIG.LOGIN_URL;
                return;
            }
            document.getElementById('userEmail').textContent = email;
            renderPDFs();
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePDF(); });
        document.getElementById('pdfModal').addEventListener('click', e => { if (e.target === e.currentTarget) closePDF(); });
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
